name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
filter-by-commitish: true
commitish: main
exclude-labels:
  - 'skip-changelog'
  - 'no-changelog'
categories:
  - title: ':green_book: Notable Changes'
    labels:
      - 'notable'
      - 'highlight'
  - title: '🚀 New Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'bugfix'
      - 'fix'
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'
      - 'major'
  - title: '� Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🔧 Maintenance & Dependencies'
    collapse-after: 5
    labels:
      - 'chore'
      - 'maintenance'
      - 'dependencies'
      - 'build'
      - 'ci'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'tests'
      - 'testing'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '👏 New Contributors'
    labels:
      - 'first-contribution'
      - 'new-contributor'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
      - 'feat'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'chore'
      - 'docs'
      - 'documentation'
      - 'dependencies'
  default: patch

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**/*'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
      - '/bugfix\/.+/'
    title:
      - '/fix/i'
      - '/bug/i'
  - label: 'feature'
    branch:
      - '/feature\/.+/'
      - '/feat\/.+/'
    title:
      - '/feat/i'
      - '/feature/i'
  - label: 'chore'
    branch:
      - '/chore\/.+/'
    title:
      - '/chore/i'
  - label: 'dependencies'
    files:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
  - label: 'ci'
    files:
      - '.github/**/*'
  - label: 'test'
    files:
      - '**/*test*'
      - '**/*spec*'
      - '__tests__/**/*'
  - label: 'build'
    files:
      - 'webpack.config.js'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - 'build/**/*'
      - 'dist/**/*'
      - 'lib/**/*'

# v3.0.0 transition template — revert to generic template after v3.0.0 is published.
# Also remove tag/name overrides from the draft-release job in release-drafter.yml workflow.
template: |
  ## ⚠️ Breaking change — Node.js runtime upgraded from Node 20 to Node 24

  `action.yml` now declares `using: node24` (previously `node20`). GitHub-hosted runners support this automatically. **Self-hosted runners must be on `actions/runner@v2.327.0` or newer** (released 2025-07-22), otherwise the action fails with `Unsupported runtime: node24`. Check with `./run.sh --version` from the runner directory.

  If your runner application can't be upgraded yet, stay on the `v2` line (`liquibase/setup-liquibase@v2`) — it remains on Node.js 20. Node.js 20 reaches end of support on GitHub-hosted runners on **2026-06-16** (default flip to node24) and is removed in **fall 2026**, so plan the migration.

  ### What's Changed

  $CHANGES

  ### Migrating from v2

  1. Verify self-hosted runner version (if applicable): `./run.sh --version` must be ≥ 2.327.0.
  2. Pin to `@v3.0.0` (or `@v3` once the floating major tag is created).
  3. Validate your workflow end-to-end.

  ### Usage

  ```yaml
  - uses: liquibase/setup-liquibase@$RESOLVED_VERSION
    with:
      version: '5.0.3'
      edition: 'community'
  ```

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
